tunnel: <TUNNEL_ID>
credentials-file: <HOME>/.cloudflared/<TUNNEL_ID>.json

loglevel: info

ingress:

  - hostname: <TEN_MIEN>
    path: (^|/)internal(;[^/]*)?/
    service: http_status:404

  - hostname: <TEN_MIEN>
    path: (^|/)actuator(;[^/]*)?(/|$)
    service: http_status:404

  - hostname: <TEN_MIEN>
    service: http://localhost:8080

  - service: http_status:404
