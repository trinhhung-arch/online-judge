name: quet-phu-thuoc

on:
  push:
    branches: [main, 'feature/**', 'bugfix/**', 'hotfix/**', 'refactor/**', 'docs/**', 'test/**', 'chore/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 23 * * *'

concurrency:
  group: trivy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Cache Maven của quet-phu-thuoc
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-quet-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: maven-quet-

      - name: Dựng hai jar sẽ triển khai
        run: |
          ./mvnw -B --no-transfer-progress -Daether.connector.http.retryHandler.count=6 -DskipTests package
          mkdir -p quet
          # `*.jar` không khớp `*.jar.original` (bản mỏng, không kèm thư viện) — cố ý.
          cp oj-api/target/oj-api-*.jar oj-worker/target/oj-worker-*.jar quet/
          ls -la quet


      - name: Trivy — CRITICAL/HIGH có bản vá thì CHẶN
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: rootfs
          scan-ref: quet
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Báo cáo đầy đủ (không chặn)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: rootfs
          scan-ref: quet
          scanners: vuln
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: false
          exit-code: '0'
          format: table

      - name: Liệt kê gói Trivy nhận ra trong jar
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: rootfs
          scan-ref: quet
          scanners: vuln
          list-all-pkgs: true
          exit-code: '0'
          format: json
          output: trivy-goi.json

      - name: Cổng có thật sự đọc jar?
        if: always()
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open("trivy-goi.json"))
          def goi(jar):
              return {p.get("Name", "") for r in d.get("Results") or []
                      for p in r.get("Packages") or []
                      if jar in r.get("Target", "") or jar in p.get("FilePath", "")}
          hong = []
          for jar, phai_co in (("oj-api-", "org.apache.tomcat.embed:tomcat-embed-core"),
                               ("oj-worker-", "com.rabbitmq:amqp-client")):
              g = goi(jar)
              print(f"{jar}*.jar: {len(g)} gói Trivy nhận ra; có {phai_co}: {phai_co in g}")
              if phai_co not in g:
                  hong.append(f"Trivy không thấy {phai_co} trong {jar}*.jar — cổng đang quét mù")
          for h in hong:
              print(f"::error::{h}")
          sys.exit(1 if hong else 0)
          PY


      - name: Cổng vẫn còn răng?
        if: always()
        run: |
          f=.github/workflows/quet-phu-thuoc.yml
          grep -q "severity: CRITICAL,HIGH$" "$f" || {
            echo "::error::Cổng chặn không còn quét đủ CRITICAL,HIGH"; exit 1; }
          grep -q "exit-code: '1'" "$f" || {
            echo "::error::Cổng chặn không còn làm CI đỏ (exit-code khác 1)"; exit 1; }
          [ "$(grep -c 'scan-type: rootfs' "$f")" -ge 3 ] || {
            echo "::error::Có bước Trivy không còn quét jar (scan-type rootfs) — quay về quét pom là mù"; exit 1; }
          echo "Cổng còn nguyên: CRITICAL,HIGH · exit-code 1 · quét jar."
