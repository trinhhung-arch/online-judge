name: sandbox-attack

on:
  push:
    branches: [main, 'feature/**', 'bugfix/**', 'hotfix/**', 'refactor/**', 'docs/**', 'test/**', 'chore/**']
  pull_request:
    branches: [main]

concurrency:
  group: sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  attacks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Cache Maven của sandbox-attack
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-sandbox-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: maven-sandbox-

      - name: Build isolate
        run: sudo ./scripts/build-isolate.sh

      - name: 14 test tấn công + đường chấm thật
        run: ./mvnw -B --no-transfer-progress -Daether.connector.http.retryHandler.count=6 -pl oj-contract,oj-worker -am verify

      - name: Đủ 14 ca và không ca nào bị skip
        run: |
          files=$(ls oj-worker/src/test/resources/attacks/*.cpp | wc -l)
          if [ "$files" -ne 14 ]; then
            echo "::error::Có $files file tấn công, phải là 14 (nfrplan 4.1)"
            exit 1
          fi
          report=oj-worker/target/failsafe-reports/TEST-dev.oj.worker.sandbox.SandboxAttackIT.xml
          if [ ! -f "$report" ]; then
            echo "::error::SandboxAttackIT không chạy. Trên Linux nó không được phép skip."
            exit 1
          fi
          grep -q 'tests="14"' "$report" || {
            echo "::error::SandboxAttackIT không chạy đủ 14 ca:"; head -3 "$report"; exit 1; }
          grep -q 'skipped="0"' "$report" || {
            echo "::error::Có ca bị skip. fail 1 case = fail build (nfrplan 4.5)"; exit 1; }
          echo "14/14 ca đã chạy, 0 skip."

      - name: Báo cáo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sandbox-reports
          path: 'oj-worker/target/failsafe-reports/'
          if-no-files-found: ignore

