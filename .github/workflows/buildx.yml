name: buildx

on:
  push:
    branches: [main, 'a/**', 'b/**']
  pull_request:
    branches: [main]

concurrency:
  group: buildx-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  anh:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            nen: linux/amd64
          - runner: ubuntu-24.04-arm
            nen: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    name: ${{ matrix.nen }}

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build ảnh
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/isolate/Dockerfile
          platforms: ${{ matrix.nen }}
          tags: oj-worker:ci
          push: false
          load: true
          cache-from: type=gha,scope=${{ matrix.nen }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nen }}

      - name: Ảnh có dùng được không
        run: |
          set -eu
          chay() { docker run --rm --entrypoint /bin/sh oj-worker:ci -c "$1"; }

          # 1 · Kiến trúc đúng như job này khai. Bắt trường hợp nhãn runner đổi nghĩa.
          that=$(docker image inspect oj-worker:ci --format '{{.Os}}/{{.Architecture}}')
          [ "$that" = "${{ matrix.nen }}" ] || {
            echo "::error::Ảnh là $that, phải là ${{ matrix.nen }}"; exit 1; }

          # 2 · File config của isolate nằm ĐÚNG chỗ binary đi tìm.
          #     Bug PREFIX ngày 05/09: `isolate --version` vẫn chạy trên một cài đặt hỏng vì
          #     nó không đọc config, nên một phép kiểm gọi --version sẽ báo xanh. Kiểm file.
          chay 'test -f /usr/local/etc/isolate' || {
            echo "::error::Thiếu /usr/local/etc/isolate — PREFIX sai, xem header Dockerfile"
            exit 1; }

          # 3 · isolate-cg-keeper có mặt. Thiếu nó thì /run/isolate/cgroup không bao giờ
          #     xuất hiện và container tắt ngay sau khi khởi động.
          chay 'test -x /usr/local/sbin/isolate-cg-keeper' || {
            echo "::error::Thiếu isolate-cg-keeper"; exit 1; }

          # 4 · Bit setuid còn nguyên. Không có nó, isolate không tạo được namespace và
          #     vài ca tấn công chuyển từ "bị chặn" sang "không chạy được" — hai kết quả
          #     nhìn giống nhau trong log (header Dockerfile đã cảnh báo đúng điều này).
          chay 'test -u /usr/local/bin/isolate' || {
            echo "::error::/usr/local/bin/isolate mất bit setuid"; exit 1; }

          # 5 · Dòng subuid. Thiếu nó thì cả isolate lẫn keeper chết lúc đọc config
          #     (config.c: die "User %s not found"). Đúng lỗi đã làm CI đỏ một lần.
          chay 'grep -q "^isolate:" /etc/subuid && grep -q "^isolate:" /etc/subgid' || {
            echo "::error::/etc/subuid hoặc /etc/subgid thiếu dòng isolate"; exit 1; }

          # 6 · Bất biến sandbox #7 — JVM của worker KHÔNG chạy root.
          uid=$(chay 'id -u')
          [ "$uid" = "1500" ] || {
            echo "::error::Worker chạy dưới uid $uid, phải là 1500 (ojworker)"; exit 1; }

          # 7 · Jar có thật và là jar của commit này, không phải tầng cache cũ.
          chay 'test -s /app/oj-worker.jar' || {
            echo "::error::Thiếu /app/oj-worker.jar"; exit 1; }

          echo "7/7 phép kiểm đạt cho ${{ matrix.nen }}."


      - name: Kích thước
        run: |
          docker image inspect oj-worker:ci --format '{{.Size}}' \
            | awk '{ printf "%s = %.0f MB\n", "${{ matrix.nen }}", $1/1024/1024 }'



