name: ci

on:
  push:
    branches: [main, 'a/**', 'b/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Cache Maven của ci
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-ci-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: maven-ci-

      - name: Build isolate
        run: sudo ./scripts/build-isolate.sh

      - name: mvnw verify
        run: ./mvnw -B --no-transfer-progress -Daether.connector.http.retryHandler.count=6 -DexcludedGroups=minio-that verify

      - name: Cấm nối chuỗi trong SQL
        run: ./scripts/kiem-noi-chuoi-sql.sh

      - name: Báo cáo test
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore

      - name: Test nào hỏng?
        if: failure()
        run: |
          for f in $(find . -path '*/target/*-reports/*.txt' 2>/dev/null); do
            grep -qE '(FAILURE|ERROR)!' "$f" || continue
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done
