# build-order.md Bước 0.8 · nfrplan M3 (CI < 10 phút).
#
# Trước khi có file này, mọi câu "ép bằng CI, không bằng lời hứa" trong ArchitectureTest
# và nfrplan 8.2 đều chưa có thật. Đây là chỗ những lời đó thành sự thật.
name: ci

on:
  push:
    branches: [main, 'a/**', 'b/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15          # nfrplan M3: > 15 phút là người ta bắt đầu bỏ qua CI

    steps:
      - uses: actions/checkout@v5

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # oj-worker giờ có IT cần sandbox thật (SandboxAttackIT, IsolateJudgeRunnerIT), và
      # chúng CỐ Ý fail thay vì skip khi thiếu isolate trên một máy Linux — một cái skip lặng
      # lẽ biến cổng chuyển của M2 thành lời hứa. Nên `mvnw verify` ở đây cũng cần isolate,
      # nếu không nó không còn nghĩa là "mọi thứ xanh" (CLAUDE.md mục 8).
      #
      # sandbox-attack.yml cài lại isolate một lần nữa, có chủ ý: khi sandbox đỏ thì dấu X
      # phải nói ngay là sandbox đỏ, chứ không phải build đỏ.
      - name: Build isolate
        run: sudo ./scripts/build-isolate.sh

      # Surefire (unit) + Failsafe (integration, *IT.java).
      #
      # Bộ IT chạy trên Postgres 16 THẬT qua Testcontainers — ubuntu-latest có sẵn Docker.
      # Đó là nơi bốn chaos test chứng minh R1 ("0 bài mất") và R2 ("0 bài chấm 2 lần"):
      # những tính chất phụ thuộc FOR UPDATE SKIP LOCKED và hành vi transaction, tức là
      # những thứ mà không unit test nào với repository giả nhìn thấy được.
      - name: mvnw verify
        run: ./mvnw -B --no-transfer-progress verify

      # Luật 5d của ArchitectureTest — phần mà ArchUnit KHÔNG làm được.
      # Từ Java 9, `a + b` biên dịch thành invokedynamic nên ArchUnit không thấy nối chuỗi.
      # Thô, nhưng nó bắt đúng thứ invokedynamic giấu mất (bất biến #5, SEC2).
      - name: Cấm nối chuỗi trong SQL
        run: |
          # Tìm MỌI thư mục tên `infrastructure`, ở bất kỳ độ sâu nào.
          #
          # Bản trước dùng glob `dev/oj/*/infrastructure/` — đúng một mức — nên nó bỏ sót
          # `dev/oj/platform/audit/infrastructure/` xuất hiện ở M4. Một hàng rào bỏ sót thì
          # tệ hơn không có hàng rào: nó tạo cảm giác đã được canh.
          mapfile -t thu_muc < <(find oj-api/src/main/java -type d -name infrastructure | sort)
          if [ ${#thu_muc[@]} -eq 0 ]; then
            echo "::error::Không tìm thấy thư mục infrastructure nào — bước kiểm này đang chạy rỗng"
            exit 1
          fi
          echo "Quét ${#thu_muc[@]} thư mục:"; printf '  %s\n' "${thu_muc[@]}"
          if grep -rInE '"\s*\+|\+\s*"' --include='*.java' "${thu_muc[@]}"; then
            echo "::error::Phát hiện nối chuỗi trong tầng infrastructure — dùng named parameter của JdbcClient"
            exit 1
          fi

      # Cả HAI thư mục. Lần đỏ đầu tiên của bước trên là một IT (failsafe), mà artifact
      # lúc ấy chỉ có surefire — tức là đúng báo cáo cần đọc thì không được giữ lại, và
      # cách duy nhất để biết test nào hỏng là chạy lại CI.
      - name: Báo cáo test
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore

      # In thẳng tên test hỏng ra log. Artifact phải tải về mới đọc được; dòng này thì nhìn
      # là thấy, và đó là khác biệt giữa sửa trong một vòng push và sửa trong ba vòng.
      - name: Test nào hỏng?
        if: failure()
        run: |
          for f in $(find . -path '*/target/*-reports/*.txt' 2>/dev/null); do
            grep -qE '(FAILURE|ERROR)!' "$f" || continue
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done

# -----------------------------------------------------------------------------
# Workflow còn lại của build-order 0.8 CHƯA thêm ở đây, vì thêm bây giờ là CI đỏ
# ngay từ lần push đầu — và một CI đỏ thường trực là một CI bị bỏ qua:
#
#   buildx.yml           image multi-arch amd64 + arm64 (C1) — cần Dockerfile cho oj-api,
#                        chưa có. infra/isolate/Dockerfile mới chỉ lo phần sandbox.
#
# sandbox-attack.yml ĐÃ BẬT ở M2, cùng lúc IsolateJudgeRunner thay ScriptedJudgeRunner.
# -----------------------------------------------------------------------------
