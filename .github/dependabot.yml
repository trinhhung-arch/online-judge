version: 2

updates:
  - package-ecosystem: maven
    directory: /oj-api
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      commonmark:
        patterns: ["org.commonmark:*"]
      ban-va:
        update-types: [patch]

  - package-ecosystem: maven
    directory: /oj-worker
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps
    groups:
      ban-va:
        update-types: [patch]

  - package-ecosystem: maven
    directory: /oj-contract
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps
    groups:
      ban-va:
        update-types: [patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Ho_Chi_Minh
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /infra/isolate
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Ho_Chi_Minh
    commit-message:
      prefix: docker
    ignore:
      - dependency-name: debian
      - dependency-name: eclipse-temurin
