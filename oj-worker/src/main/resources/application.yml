spring:
  application:
    name: oj-worker

  rabbitmq:
    host: ${OJ_RABBIT_HOST:localhost}
    port: ${OJ_RABBIT_PORT:5672}
    username: ${OJ_RABBIT_USER:ojuser}
    password: ${OJ_RABBIT_PASSWORD:ojpass}
    listener:
      simple:
        prefetch: 1
        acknowledge-mode: manual
        missing-queues-fatal: false

  main:
    web-application-type: none

oj:
  worker:
    host-name: ${OJ_WORKER_HOST_NAME:worker-chua-dat-ten}
    arch: ${OJ_WORKER_ARCH:arm64}
    slots: ${OJ_WORKER_SLOTS:6}
    lease: 120s
    progress-interval: 30s
    idle-poll: 500ms
    shutdown-grace: 30s
    request-timeout: 5s
    result-retry-min: 1s
    result-retry-max: 30s
    host-factor: 1.000
    testdata-source: ${OJ_WORKER_TESTDATA_SOURCE:api}

    api-base-url: ${OJ_API_BASE_URL:http://localhost:8080}
    internal-secret: ${OJ_INTERNAL_SHARED_SECRET}

    rabbit:
      enabled: ${OJ_WORKER_RABBIT_ENABLED:true}
      live-queue: judge.live
      rejudge-queue: judge.rejudge

    sandbox:
      enabled: ${OJ_SANDBOX_ENABLED:true}
      isolate-binary: ${OJ_ISOLATE_BIN:/usr/local/bin/isolate}
      box-root: ${OJ_ISOLATE_BOX_ROOT:/var/local/lib/isolate}
      first-box-id: ${OJ_WORKER_FIRST_BOX_ID:0}
      watchdog-slack: 10s
      program-path: [/usr/bin, /bin, /usr/local/bin]

      compile:
        processes: 64
        open-files: 256
        max-file-size: 64MB
        log-limit: 32KB
        pch-dir: ${OJ_WORKER_PCH_DIR:/opt/oj/pch}
      run:
        extra-time: 500ms
        processes: 1
        open-files: 64
        max-file-size: 1MB
        stderr-limit: 8KB
        hidden-dirs: [/proc, /tmp]

      cache:
        dir: ${OJ_WORKER_CACHE_DIR:/var/tmp/oj-worker}
        max-entries: 512

      benchmark:
        interval: 15m
        samples: 3
        reference-cpu-ms: ${OJ_HOST_REFERENCE_CPU_MS:0}
        drift-alert-pct: 8.0

logging:
  level:
    dev.oj: INFO
