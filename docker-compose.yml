services:
  postgres:
    image: postgres:16-alpine
    container_name: oj-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ojdb
      POSTGRES_USER: ojuser
      POSTGRES_PASSWORD: ojpass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Quyết định D — hai role oj_app / oj_migrator, tạo lúc khởi tạo volume.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ojuser -d ojdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: oj-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: oj-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ojuser
      RABBITMQ_DEFAULT_PASS: ojpass
    ports:
      - "5672:5672"    # AMQP - backend va judge worker ket noi qua port nay
      - "15672:15672"  # Management UI - mo http://localhost:15672 tren trinh duyet
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # Testdata content-addressed. Chưa ai gọi tới trước M4, nhưng nó nằm trong bộ bốn
  # service của build-order.md Bước 0.4 — dựng sẵn để "docker compose up là chạy được"
  # đúng như README hứa, thay vì phát hiện thiếu vào tuần 8.
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: oj-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OJ_MINIO_ACCESS_KEY:-ojminio}
      MINIO_ROOT_PASSWORD: ${OJ_MINIO_SECRET_KEY:-ojminio123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:


