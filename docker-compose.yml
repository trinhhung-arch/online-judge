services:
  postgres:
    image: postgres:16-alpine
    container_name: oj-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ojdb
      POSTGRES_USER: ojuser
      POSTGRES_PASSWORD: ${OJ_POSTGRES_PASSWORD:?Thiếu OJ_POSTGRES_PASSWORD trong .env — xem .env.example}
    ports:
      - "127.0.0.1:5432:5432"
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /wal-archive/%f.gz && gzip -c %p > /wal-archive/%f.gz.tmp && mv /wal-archive/%f.gz.tmp /wal-archive/%f.gz
      - -c
      - archive_timeout=60s
      - -c
      - wal_level=replica
      - -c
      - wal_compression=zstd
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ${OJ_WAL_ARCHIVE_DIR:?Thiếu OJ_WAL_ARCHIVE_DIR trong .env — xem .env.example}:/wal-archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ojuser -d ojdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: oj-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${OJ_REDIS_PASSWORD:?Thiếu OJ_REDIS_PASSWORD trong .env — xem .env.example}"]
    environment:
      REDISCLI_AUTH: ${OJ_REDIS_PASSWORD:?Thiếu OJ_REDIS_PASSWORD trong .env — xem .env.example}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: oj-rabbitmq
    hostname: oj-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ojuser
      RABBITMQ_DEFAULT_PASS: ${OJ_RABBIT_PASSWORD:?Thiếu OJ_RABBIT_PASSWORD trong .env — xem .env.example}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "5672"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  minio:
    image: quay.io/minio/minio:RELEASE.2024-10-13T13-34-11Z@sha256:9535594ad4122b7a78c6632788a989b96d9199b483d3bd71a5ceae73a922cdfa
    container_name: oj-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OJ_MINIO_ACCESS_KEY:?Thiếu OJ_MINIO_ACCESS_KEY trong .env — xem .env.example}
      MINIO_ROOT_PASSWORD: ${OJ_MINIO_SECRET_KEY:?Thiếu OJ_MINIO_SECRET_KEY trong .env — xem .env.example}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
