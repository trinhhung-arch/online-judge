# ★ HAI LUẬT CHO MỌI SERVICE Ở ĐÂY — đọc trước khi thêm service thứ năm.
#
#   1. Cổng publish LUÔN có tiền tố 127.0.0.1. Viết trần "6379:6379" là Docker nghe trên mọi
#      địa chỉ, tức cả mạng LAN. Đo ngày 2026-09-16 trên host Mac: tường lửa macOS tắt, cả sáu
#      cổng mở ra 192.168.x.x, và Redis trả PONG cho một máy lạ không cần mật khẩu.
#      Container worker vẫn tới được cổng 127.0.0.1 qua host.docker.internal (--add-host
#      host-gateway) — đã thử cùng ngày trên OrbStack.
#
#   2. Mật khẩu LUÔN là ${BIEN:?}, không bao giờ là chữ viết thẳng hay ${BIEN:-mac_dinh}.
#      Chữ viết thẳng nằm trong git, nên ai có repo cũng có mật khẩu. Mặc định cũng vậy.
#      Thiếu biến thì `docker compose` dừng NGAY với tên biến — thà vậy còn hơn lên bằng một
#      mật khẩu ai cũng biết.
#
#   Đóng cổng KHÔNG thay được mật khẩu: chính phép thử trên cho thấy container worker tới
#   được các cổng này, nên một lần thoát sandbox là tới được Postgres và Redis.
services:
  postgres:
    image: postgres:16-alpine
    container_name: oj-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ojdb
      POSTGRES_USER: ojuser
      # CHỈ có tác dụng lúc volume còn trống. Đổi trên DB đang chạy thì dùng
      # `ALTER ROLE ojuser PASSWORD ...` — sửa biến này rồi `up -d` KHÔNG đổi gì cả.
      POSTGRES_PASSWORD: ${OJ_POSTGRES_PASSWORD:?Thiếu OJ_POSTGRES_PASSWORD trong .env — xem .env.example}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Quyết định D — hai role oj_app / oj_migrator, tạo lúc khởi tạo volume.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ojuser -d ojdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: oj-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${OJ_REDIS_PASSWORD:?Thiếu OJ_REDIS_PASSWORD trong .env — xem .env.example}"]
    environment:
      # redis-cli tự đọc biến này, nên healthcheck không phải đặt mật khẩu lên dòng lệnh.
      REDISCLI_AUTH: ${OJ_REDIS_PASSWORD:?Thiếu OJ_REDIS_PASSWORD trong .env — xem .env.example}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      # `grep PONG`, KHÔNG tin mã thoát. Đo 2026-09-16 trên redis 7.4: redis-cli in
      # "AUTH failed: ERR ..." mà vẫn thoát 0. Chỉ gọi `redis-cli ping` thì healthcheck xanh
      # trên một Redis mà ứng dụng không vào được.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: oj-rabbitmq
    # ★ KHÔNG được bỏ dòng này. Node name của RabbitMQ là `rabbit@$(hostname -s)`, và nếu
    # không đặt `hostname` thì Docker lấy CONTAINER ID làm hostname. Hệ quả: mỗi lần container
    # được tạo lại — đổi image, sửa healthcheck, `up -d` sau khi sửa compose — là một node
    # name MỚI, tức mnesia rỗng: mọi hàng đợi durable biến mất, mọi message trong đó mất theo.
    #
    # Đã xảy ra 2026-09-10: một lần `docker compose up -d rabbitmq` để nhận healthcheck mới
    # làm node đổi từ rabbit@098937e9b66b sang rabbit@0fe2b03d893e, judge.live/judge.rejudge/
    # judge.dead biến sạch, và worker chết với `NOT_FOUND - no queue 'judge.live'` (nó khai
    # báo THỤ ĐỘNG, chỉ oj-api tạo hàng đợi). Lần ấy hàng đợi rỗng nên không mất bài nộp —
    # đó là may, không phải thiết kế. Với một hệ thống mà lời hứa số hai là "không mất bài
    # nộp", một broker tự xoá mình theo container ID là thứ không được phép tồn tại.
    #
    # Đổi giá trị này = đổi node name = một lần reset nữa. Đặt rồi thì đừng đụng vào.
    hostname: oj-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ojuser
      # CHỈ có tác dụng lúc mnesia còn trống — y như POSTGRES_PASSWORD. Đổi trên broker đang
      # chạy: `docker exec -i oj-rabbitmq rabbitmqctl change_password ojuser`, rồi khởi động lại
      # oj-api VÀ worker (scripts/trien-khai-mac.sh --khong-build) để chúng nối bằng mật khẩu mới.
      RABBITMQ_DEFAULT_PASS: ${OJ_RABBIT_PASSWORD:?Thiếu OJ_RABBIT_PASSWORD trong .env — xem .env.example}
    ports:
      - "127.0.0.1:5672:5672"    # AMQP - backend va judge worker (qua host.docker.internal) ket noi
      - "127.0.0.1:15672:15672"  # Management UI - mo http://localhost:15672 tren trinh duyet
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # ★ Healthcheck này KHÔNG được dựng một máy ảo Erlang. Đọc trước khi "nâng cấp" nó.
      #
      # Lệnh hiển nhiên ở đây là `rabbitmq-diagnostics -q ping` — tài liệu RabbitMQ khuyên thế,
      # và nó từng nằm đúng chỗ này. Nó hỏng theo hai tầng, đo thật ngày 2026-09-10:
      #
      #   Tầng 1 — CHÍ MẠNG. CLI dựng một node Erlang phân tán trong dải cổng CHỈ 11 chỗ
      #   (`inet_dist_listen_min 35672 … max 35682`, do chính CLI đặt). Lần ping bị Docker
      #   SIGKILL khi hết `timeout` để lại tiến trình beam con giữ luôn một cổng trong dải ấy.
      #   Đủ 11 lần là dải cạn, và từ đó MỌI lần ping đều hỏng — mỗi lần hỏng đẻ thêm một xác.
      #   Kết quả: 460 tiến trình treo, 11,2 GiB, FailingStreak 4118, trong khi broker chạy tốt.
      #
      #   Tầng 2 — âm ỉ. Thêm `--timeout 5` (< `timeout` của Docker) chặn được tầng 1: epmd
      #   sạch, dải cổng không còn bị giữ, healthcheck xanh trở lại. Nhưng ĐO LẠI SAU 2 GIỜ
      #   vẫn thấy 17 tiến trình beam mồ côi (ppid=1, sleeping, 36 luồng) — ping THÀNH CÔNG
      #   mà tiến trình vẫn không thoát. Nguyên nhân nằm trong CLI của RabbitMQ, không phải
      #   ở cấu hình này, nên không vá được từ đây.
      #
      # `nc -z` không dựng VM nào: một tiến trình busybox vài chục KB, không đụng epmd, không
      # đụng dải cổng dist. Đổi lại nó chỉ trả lời được "cổng AMQP có nhận kết nối không" —
      # KHÔNG phát hiện được resource alarm (đĩa/bộ nhớ) khiến broker chặn publisher. Đó là
      # đánh đổi có chủ đích: một chỉ số hẹp mà đúng, thay cho một chỉ số rộng mà tự phá hỏng
      # chính thứ nó đo. Cần bắt cả alarm thì đường đi là một sidecar gọi HTTP management API,
      # không phải mang CLI quay lại đây.
      #
      # Đã kiểm ca âm: `nc -z localhost 5672` trả 0, `nc -z localhost 5699` trả khác 0.
      test: ["CMD", "nc", "-z", "localhost", "5672"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Testdata content-addressed. Chưa ai gọi tới trước M4, nhưng nó nằm trong bộ bốn
  # service của build-order.md Bước 0.4 — dựng sẵn để "docker compose up là chạy được"
  # đúng như README hứa, thay vì phát hiện thiếu vào tuần 8.
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: oj-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OJ_MINIO_ACCESS_KEY:?Thiếu OJ_MINIO_ACCESS_KEY trong .env — xem .env.example}
      MINIO_ROOT_PASSWORD: ${OJ_MINIO_SECRET_KEY:?Thiếu OJ_MINIO_SECRET_KEY trong .env — xem .env.example}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:


