<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đề bài · Online Judge</title>
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/vendor/npm/katex@0.16.11/dist/katex.min.css"
          integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+"
          crossorigin="anonymous">
</head>
<body>
<a class="bo-qua" href="#chinh">Bỏ qua tới nội dung chính</a>
<main id="chinh">
    <h1 id="tieu-de">Đang tải…</h1>
    <p id="gioi-han" class="goi-y"></p>
    <p id="thong-bao" class="thong-bao" role="status" aria-live="polite"></p>

    <div class="hai-cot">
        <section aria-labelledby="nhan-de">
            <h2 id="nhan-de">Đề bài</h2>
            <div id="de-bai" class="de-bai"></div>
        </section>

        <section aria-labelledby="nhan-nop">
            <h2 id="nhan-nop">Nộp bài</h2>
            <label for="ngon-ngu">Ngôn ngữ</label>
            <select id="ngon-ngu"></select>

            <label for="ma-nguon" class="goi-y" style="margin-top:12px">Mã nguồn</label>
            <div id="khung-soan" class="khung-soan"></div>
            <textarea id="ma-nguon" hidden aria-hidden="true"></textarea>
            <p class="goi-y" id="trang-thai-nhap">Nháp được lưu trong trình duyệt của bạn.</p>

            <div class="hang-nop">
                <button id="nop">Nộp bài</button>
                <span id="dem-nguoc" class="goi-y" role="status" aria-live="polite"></span>
            </div>
        </section>
    </div>
</main>

<script src="/vendor/npm/katex@0.16.11/dist/katex.min.js"
        integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg"
        crossorigin="anonymous" defer></script>
<script src="/vendor/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
        integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk"
        crossorigin="anonymous" defer></script>
<script type="module" src="/js/problem.js"></script>
</body>
</html>
