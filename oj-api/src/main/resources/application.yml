spring:
  application:
    name: oj-backend

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB
      file-size-threshold: 1MB

  flyway:
    url: ${OJ_DB_URL:jdbc:postgresql://localhost:5432/ojdb}
    user: ${OJ_DB_MIGRATOR_USER:${OJ_DB_APP_USER:ojuser}}
    password: ${OJ_DB_MIGRATOR_PASSWORD:${OJ_DB_APP_PASSWORD:ojpass}}

  data:
    redis:
      host: localhost
      port: 6379
      password: ${OJ_REDIS_PASSWORD:}
      timeout: 200ms
      connect-timeout: 200ms

  rabbitmq:
    host: ${OJ_RABBIT_HOST:localhost}
    port: ${OJ_RABBIT_PORT:5672}
    username: ${OJ_RABBIT_USER:ojuser}
    password: ${OJ_RABBIT_PASSWORD:ojpass}
    connection-timeout: 200ms

  mail:
    host: ${OJ_MAIL_HOST:}
    port: ${OJ_MAIL_PORT:587}
    username: ${OJ_MAIL_USERNAME:}
    password: ${OJ_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  task:
    scheduling:
      pool:
        size: 6

server:
  port: 8080
  address: 127.0.0.1

management:
  server:
    port: 8081
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      show-components: always
      group:
        sanSang:
          include: db
          show-details: always
      status:
        http-mapping:
          out-of-service: 200
  health:
    defaults:
      enabled: true
  metrics:
    tags:
      application: oj-api
    distribution:
      percentiles:
        http.server.requests: 0.95
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,300ms,500ms,1s,2s

logging:
  level:
    org.springframework.security: DEBUG

oj:
  submission:
    max-source-bytes: 65536
    rate-limit: 10s

  judge:
    lease: 120s
    reaper-interval: 15s
    max-ie-retries: 2
    max-reaps: 2
    result-batch-size: 20
    reference-host-name: mac-m1max-host

    host-liveness: 30m
    throughput-estimate: 5.0
    metrics-interval: 10s

    rejudge:
      max-in-flight: 2
      live-wait-brake: 5s
      batch-size: 200

    rabbit:
      enabled: ${OJ_RABBIT_ENABLED:true}

  sse:
    timeout: 5m
    heartbeat: 15s

  page:
    default-size: 20
    max-size: 50

  internal:
    shared-secret: ${OJ_INTERNAL_SHARED_SECRET}

  security-headers:
    content-security-policy: >-
      default-src 'none';
      script-src 'self' https://challenges.cloudflare.com;
      style-src 'self';
      style-src-attr 'unsafe-inline';
      font-src 'self';
      img-src 'self' data:;
      connect-src 'self';
      form-action 'self';
      frame-src https://challenges.cloudflare.com;
      base-uri 'none';
      frame-ancestors 'none';
      object-src 'none'

    hsts-max-age: ${OJ_HSTS_MAX_AGE:0s}

  auth:
    jwt-secret: ${OJ_JWT_SECRET}
    access-ttl: 15m
    refresh-ttl: 7d
    bcrypt-cost: 12
    max-login-failures: 5
    login-window: 60s
    lockout: 15m
    max-registrations-per-ip: ${OJ_MAX_REGISTRATIONS_PER_IP:10}
    registration-window: 1h
    totp-key: ${OJ_TOTP_KEY}
    require-admin-two-factor: ${OJ_REQUIRE_ADMIN_2FA:true}
    bcrypt-concurrency: ${OJ_BCRYPT_CONCURRENCY:4}
    bcrypt-wait: 150ms
    login-min-interval: 2s

    totp-max-failures: 10
    totp-lockout: 15m

    turnstile:
      enabled: ${OJ_TURNSTILE_ENABLED:false}
      site-key: ${OJ_TURNSTILE_SITE_KEY:}
      secret: ${OJ_TURNSTILE_SECRET:}
      hostnames: ${OJ_TURNSTILE_HOSTNAMES:}
      verify-url: ${OJ_TURNSTILE_VERIFY_URL:https://challenges.cloudflare.com/turnstile/v0/siteverify}
      timeout: 3s

    email-verification:
      enabled: ${OJ_EMAIL_VERIFICATION_ENABLED:false}
      from: ${OJ_MAIL_FROM:}
      ttl: 30m
      max-attempts: 5
      resend-cooldown: 60s

  jobs:
    lease: 120s
    poll-interval: 5s

  contest:
    standings-interval: 2s
    standings-batch-size: 500
    standings-grace: 5m
    top-size: 50

    drift-check-interval: 15m
    drift-check-window: 7d
    penalty-minutes-max: 1440

  api-rate-limit:
    per-user: ${OJ_API_RATE_LIMIT_USER:100}
    per-ip: ${OJ_API_RATE_LIMIT_IP:600}
    window: 1m

  ai:
    daily-quota: 5
    timeout: 30s

  datasource:
    app:
      jdbc-url: ${OJ_DB_URL:jdbc:postgresql://localhost:5432/ojdb}
      username: ${OJ_DB_APP_USER:ojuser}
      password: ${OJ_DB_APP_PASSWORD:ojpass}
      maximum-pool-size: 20
      pool-name: oj-app
    judge:
      jdbc-url: ${OJ_DB_URL:jdbc:postgresql://localhost:5432/ojdb}
      username: ${OJ_DB_APP_USER:ojuser}
      password: ${OJ_DB_APP_PASSWORD:ojpass}
      maximum-pool-size: 6
      pool-name: oj-judge
