# =============================================================================
# Cấu hình ArchUnit — BẮT BUỘC đi kèm ArchitectureTest.java
# (docs/build-order.md Bước 0.7)
# =============================================================================

# --- Dòng quan trọng nhất của file này ---------------------------------------
# Ở M0 chưa có module nào, nên mọi luật đều khớp 0 class. Mặc định ArchUnit coi
# "should trên tập rỗng" là FAIL — nghĩa là không có dòng này thì ArchitectureTest
# đỏ ngay từ commit đầu, và cả ý định "viết luật trước khi có code" sụp đổ.
#
# ⚠️ Đổi lại thành true ở M4, khi mọi module đã tồn tại. Từ lúc đó, một luật khớp
#    0 class thường có nghĩa là ai đó vừa đổi tên package và luật đã âm thầm
#    ngừng bảo vệ bất cứ thứ gì — đúng loại lỗi bạn muốn CI hét lên.
archRule.failOnEmptyShould=false

# --- Tốc độ (M3-nfr: CI phải xong dưới 10 phút) ------------------------------
# Không đi giải quyết class của bên thứ ba mà chỉ được nhắc tới gián tiếp.
# Mọi luật ở đây chỉ hỏi "phụ thuộc này trỏ đi đâu", không cần mở class đích ra đọc.
resolveMissingDependenciesFromClassPath=false
